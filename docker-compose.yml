version: '3.8'

services:
  api:
    build: .
    container_name: trading_signal_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: trading_signal_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
